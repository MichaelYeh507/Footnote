[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    live: touches the real Supabase project; skips without credentials.
        Deselect with -m "not live".
    corpus: reads the local corpus filings; skips cleanly when they are
        absent (RAG_FILINGS_DIR). Deselect with -m "not corpus".
